# Gabarit à copier sur le serveur Contabo dans
# /etc/nginx/sites-available/shop.tacynt.com.conf, puis :
#   ln -s /etc/nginx/sites-available/shop.tacynt.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Volontairement HTTP seul : c'est Certbot (déjà installé sur ce serveur,
# même outil que pour les autres sites) qui ajoute lui-même le bloc HTTPS
# (ssl_certificate + redirection 80→443) au premier lancement, voir
# docs/deployment.md section 2. Ne pas ajouter de bloc 443 ici à la main —
# --expand (deploy/domain-watcher/sync-certs.sh) réédite ce fichier à chaque
# nouvelle boutique et s'appuie sur cette structure générée par Certbot.

server {
    listen 80;
    listen [::]:80;

    # Un seul bloc pour TOUT le domaine : proxy.ts (app/proxy.ts) résout le
    # tenant uniquement à partir du header Host reçu — shop.tacynt.com et
    # chaque {organisation}.shop.tacynt.com sont routés par l'application
    # elle-même, jamais par nginx. Le wildcard ici ne fait que router le
    # trafic ; seuls les sous-domaines listés dans le certificat (géré par
    # sync-certs.sh à chaque inscription) présentent un TLS valide.
    server_name shop.tacynt.com *.shop.tacynt.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        # Obligatoire : proxy.ts résout l'organisation depuis ce header
        # exact. Sans ça, chaque boutique verrait "shop.tacynt.com" au lieu
        # de son propre sous-domaine et l'app ne saurait jamais quel tenant
        # servir.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
