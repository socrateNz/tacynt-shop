name: Deploy

# Pas de build en CI, pas de registre d'images (décision verrouillée du plan
# de déploiement) : la CI se contente de déclencher le script de déploiement
# directement sur le serveur Contabo via SSH. Secrets requis dans les
# paramètres du dépôt (Settings > Secrets and variables > Actions) :
# SSH_HOST, SSH_USER, SSH_PRIVATE_KEY. Voir docs/deployment.md.
#
# La clé SSH_PRIVATE_KEY est RESTREINTE côté serveur (authorized_keys,
# command="…/deployer-tacynt-shop.sh $SSH_ORIGINAL_COMMAND",restrict …) :
# quoi que ce job envoie comme "script", le serveur force l'exécution de ce
# seul script et ne lui passe que $SSH_ORIGINAL_COMMAND en argument — une clé
# compromise ne peut donc jamais exécuter de commande arbitraire sur ce VPS
# partagé (MedDoc, Shede). Le script lui-même revalide que cet argument est
# bien un SHA de commit avant d'y toucher.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deux push rapprochés déclenchaient deux runs en parallèle, tous deux faisant
# `git pull` sur le MÊME dossier serveur en même temps — l'un des deux perdait
# la course avec "cannot lock ref ... unable to update local ref" (constaté en
# production). File d'attente plutôt qu'annulation : on ne veut jamais couper
# un déploiement déjà en train de builder/migrer, juste éviter le
# chevauchement du prochain.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Un build à froid (sans cache Docker côté serveur) a pris jusqu'à ~6 min
    # en pratique sur ce VPS partagé, parfois plus sous charge (MedDoc/Shede/
    # blanchix tournent en même temps) — le defaut command_timeout
    # d'appleboy/ssh-action (10m) a déjà coupé la connexion en plein build une
    # fois, laissant le script serveur tourner sans que cette Action ne le
    # sache (ni ne puisse faire échouer le job en conséquence) : marge large
    # des deux côtés.
    timeout-minutes: 30
    steps:
      - name: Déployer sur le serveur partagé (clé restreinte à deployer-tacynt-shop.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: ${{ github.sha }}
