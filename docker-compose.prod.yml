# Production uniquement — docker-compose.yml (racine) reste le fichier dev
# (Postgres seul, utilisé par `npm run dev` en local) et n'est pas modifié.
# Utilisation : docker compose -f docker-compose.prod.yml --env-file .env.production up -d
services:
  postgres:
    image: postgres:16
    container_name: tacynt-shop-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: tacynt_shop
      POSTGRES_USER: tacynt_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - tacynt-shop-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacynt_owner -d tacynt_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tacynt-shop-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Rôle propriétaire des migrations — bypass RLS, jamais utilisé pour
      # répondre à une requête utilisateur (lib/db/system-client.ts).
      DATABASE_URL: postgresql://tacynt_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/tacynt_shop?schema=public
      # Rôle applicatif runtime — soumis à RLS (lib/db/client.ts).
      RUNTIME_DATABASE_URL: postgresql://tacynt_app:${POSTGRES_APP_PASSWORD}@postgres:5432/tacynt_shop?schema=public
      # Domaine racine pour la résolution de sous-domaine tenant (proxy.ts) —
      # {organisation}.shop.tacynt.com.
      APP_ROOT_DOMAIN: shop.tacynt.com
      NODE_ENV: production
      # Canal vers deploy/domain-watcher/ (hôte, hors conteneur) : chaque
      # inscription y dépose la liste à jour des boutiques pour étendre le
      # certificat Certbot au nouveau sous-domaine (lib/tenant/request-cert-refresh.ts).
      PENDING_DOMAINS_DIR: /pending-domains
    ports:
      # Bind sur 127.0.0.1 uniquement : le conteneur n'est jamais exposé
      # publiquement, nginx (sur l'hôte) est le seul point d'entrée.
      - "127.0.0.1:3005:3000"
    volumes:
      # Répertoire créé et chown 1001:1001 (uid "nextjs" du Dockerfile) lors
      # du premier déploiement — voir docs/deployment.md section 3.
      - ./run/pending-domains:/pending-domains

volumes:
  # Nom distinct du volume dev (tacynt-shop-pgdata) — pas de collision
  # possible si jamais testé sur la même machine.
  tacynt-shop-pgdata-prod:
