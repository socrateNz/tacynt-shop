# Production uniquement — docker-compose.yml (racine) reste le fichier dev
# (Postgres seul, utilisé par `npm run dev` en local) et n'est pas modifié.
# Utilisation : docker compose -f docker-compose.prod.yml --env-file .env.production up -d
services:
  postgres:
    image: postgres:16
    container_name: tacynt-shop-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: tacynt_shop
      POSTGRES_USER: tacynt_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - tacynt-shop-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacynt_owner -d tacynt_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Nom explicite : deploy/scripts/deployer-tacynt-shop.sh retague cette
    # image (:rollback) avant de reconstruire, pour pouvoir revenir en
    # arrière sur le conteneur applicatif seul si le healthcheck post-déploi
    # échoue. Sans ce nom, Compose en choisirait un implicitement selon le
    # nom du projet — pas assez fiable pour un script qui doit le cibler
    # précisément.
    image: tacynt-shop-app:latest
    container_name: tacynt-shop-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Rôle propriétaire des migrations — bypass RLS, jamais utilisé pour
      # répondre à une requête utilisateur (lib/db/system-client.ts).
      DATABASE_URL: postgresql://tacynt_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/tacynt_shop?schema=public
      # Rôle applicatif runtime — soumis à RLS (lib/db/client.ts).
      RUNTIME_DATABASE_URL: postgresql://tacynt_app:${POSTGRES_APP_PASSWORD}@postgres:5432/tacynt_shop?schema=public
      # Domaine racine pour la résolution de sous-domaine tenant (proxy.ts) —
      # {organisation}.shop.tacynt.com.
      APP_ROOT_DOMAIN: shop.tacynt.com
      NODE_ENV: production
      # Paiement Mobile Money Codees — un seul compte marchand pour toute la
      # plateforme (lib/payments/codees.ts).
      CODEES_API_KEY: ${CODEES_API_KEY}
      CODEES_SECRET_KEY: ${CODEES_SECRET_KEY}
      # Envoi de l'email de confirmation de paiement (lib/email/).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # Canal vers deploy/domain-watcher/ (hôte, hors conteneur) : chaque
      # inscription y dépose la liste à jour des boutiques pour étendre le
      # certificat Certbot au nouveau sous-domaine (lib/tenant/request-cert-refresh.ts).
      PENDING_DOMAINS_DIR: /pending-domains
    ports:
      # Bind sur 127.0.0.1 uniquement : le conteneur n'est jamais exposé
      # publiquement, nginx (sur l'hôte) est le seul point d'entrée. Port
      # choisi selon la convention du serveur partagé (3000 MedDoc, 3001
      # Shede déjà pris, 3002 pris par "blanchix" (découvert au déploiement,
      # non documenté avant) — nouvelles applications : 3003, 3004…).
      - "127.0.0.1:3003:3000"
    volumes:
      # Répertoire créé et chown 1001:1001 (uid "nextjs" du Dockerfile) lors
      # du premier déploiement — voir docs/deployment.md section 3.
      - ./run/pending-domains:/pending-domains

  # Image "app" volontairement allégée (.next/standalone) : ni le dossier
  # prisma/ (migrations) ni le CLI Prisma lui-même n'y sont copiés — un
  # `npx prisma` dedans irait chercher la dernière version sur le registre
  # npm au lieu de celle du projet (bug constaté au premier déploiement).
  # Ce service réutilise l'étape "builder" du même Dockerfile (node_modules
  # complet, déjà construit) uniquement pour les migrations et le script de
  # mot de passe — jamais démarré par `up`, seulement via `run --rm`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    # Cible une étape différente du même Dockerfile que "app" (builder, pas
    # l'image finale) : pas de collision de tag malgré le nom proche.
    image: tacynt-shop-migrate:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tacynt_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/tacynt_shop?schema=public
      RUNTIME_DATABASE_URL: postgresql://tacynt_app:${POSTGRES_APP_PASSWORD}@postgres:5432/tacynt_shop?schema=public

volumes:
  # Nom distinct du volume dev (tacynt-shop-pgdata) — pas de collision
  # possible si jamais testé sur la même machine.
  tacynt-shop-pgdata-prod:
